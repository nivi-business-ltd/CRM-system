crons:
  - name: task-reminders
    description: "Emails the admin each morning about tasks due today and due tomorrow"
    cron: "0 8 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/task-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
